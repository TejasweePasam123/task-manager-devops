apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: task-manager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: tejasweetaskmanageracr2026.azurecr.io/task-manager-frontend:v2

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"