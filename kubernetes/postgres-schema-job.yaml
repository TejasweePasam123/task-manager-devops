apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-schema-init
  namespace: task-manager

spec:
  template:
    metadata:
      labels:
        app: postgres-schema-init

    spec:
      restartPolicy: OnFailure

      containers:
        - name: schema-init
          image: postgres:17

          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: schema
              mountPath: /schema

          command:
            - sh
            - -c
            - |
              psql \
                -h postgres \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" \
                -f /schema/schema.sql

      volumes:
        - name: schema
          configMap:
            name: postgres-schema